screens:
  short_screen:
    display_name: "OWS Short Screen"
    type: quant_composite

    universe:
      name: "OWS Short Screen"
      as_of: "2026-03"

    factor_weights:
      # Valuation (sum: 1.0)
      abs_ps_factor: 0.25
      rel_ps_factor: 0.25
      abs_fcf_factor: 0.25
      rel_fcf_factor: 0.25

      # Growth (sum: 1.0)
      decel_factor: 0.5
      accel_factor: 0.5

      # Profitability (sum: 1.0)
      gm_factor: 0.5
      ebit_factor: 0.5

      # Balance Sheet (sum: 1.0)
      debt_ebitda_factor: 0.2
      debt_sales_factor: 0.2
      debt_ev_factor: 0.2
      refi_risk_factor: 0.2
      liquidity_risk_factor: 0.2

      # Cash Flow (sum: 1.0, each weight: 1/7)
      fcf_conv_factor: 0.142857
      accrual_factor: 0.142857
      dso_factor: 0.142857
      dio_factor: 0.142857
      dpo_factor: 0.142857
      def_rev_factor: 0.142857
      dilution_factor: 0.142857

      # Non-GAAP (sum: 1.0)
      ebit_adj_factor: 0.5
      eps_adj_factor: 0.5

      # Sentiment (sum: 1.0)
      short_int_factor: 0.5
      ratings_factor: 0.5

    scoring:
      mscore_manipulation_threshold: -2.22
      nan_default_standard: 0.5
      nan_default_balance_sheet: 0.0
      nan_default_zero_factors:
        - debt_ebitda_factor
        - debt_sales_factor
        - liquidity_risk_factor
        - dso_factor
        - dio_factor
        - dpo_factor
        - def_rev_factor

  cyclicals:
    display_name: "Cyclicals"
    type: curated

    universe:
      name: "Cyclicals"
      as_of: "2026-08"

  competition:
    display_name: "Competition"
    type: curated

    universe:
      name: "Competition"
      as_of: "2026-08"

  structural:
    display_name: "Structural"
    type: curated

    universe:
      name: "Structural"
      as_of: "2026-08"

  management_comp:
    display_name: "Management Comp"
    type: curated

    universe:
      name: "Management Comp"
      as_of: "2026-08"

  rising_short_interest:
    display_name: "Rising Short Interest"
    type: quant_composite

    universe:
      name: "Rising Short Interest"
      as_of: "2026-08"
    # No factor_weights, no scoring block — this screen has no factor
    # model yet. That absence is the signal score.py and app.py use to
    # tell it apart from short_screen.

# Thresholds for src/refresh.py's pre-write validation gate (Phase 3d
# Part 2a). Proposed starting values — tune as real refresh cycles reveal
# normal turnover/noise levels.
refresh:
  # Null rate spike check: flag a column whose null rate rose by more than
  # this many percentage points versus the stored table. Ordinary week-to-
  # week noise in individual fields is a few points at most; a real break
  # (a dropped/renamed source column) tends to jump a column from near-0%
  # to near-100% null.
  null_rate_max_increase_pct: 0.15

# Thresholds for src/historical_ingest.py (Phase 4a). Not a screen — see
# that module's docstring.
historical:
  # Sign-convention gate: reject the import unless corr(price move,
  # Absolute Performance) <= -this value on both sheets. Measured on the
  # supplied file: -0.99998 (Active) / -0.99997 (Whiteboard) — 0.95 is a
  # wide margin below either, so this only trips on a genuine convention
  # flip (which would land near +1.0), never on ordinary noise.
  sign_convention_min_abs_corr: 0.95
  # Benchmark-consistency check: flag a row where recomputing relative
  # performance from its own price/benchmark levels differs from the
  # stored value by more than this (absolute, e.g. 0.01 = 1 percentage
  # point). Every performance value in the source file is rounded to a
  # whole percentage point, which bounds the expected gap at 0.005 plus a
  # little slack from 2dp-rounded price levels — measured max observed:
  # 0.00526 (Active, n=438), 0.00498 (Whiteboard, n=102). 0.01 is ~2x that
  # bound. Because the bound is arithmetic (rounding), not measurement
  # noise, it cannot grow on a future file — if this check ever fires,
  # something is genuinely wrong (wrong instrument, swapped column,
  # misaligned row) and the tolerance must NOT be widened to silence it.
  benchmark_consistency_tolerance: 0.01

# Vendor prices and thresholds for src/price_history.py / src/whiteboard_horizons.py
# (Phase 4b). Not a screen — see those modules' docstrings and PHASE4B_SCOPE.md.
prices:
  # yfinance/Stooq vendor symbol overrides for bbg_tickers that don't fit the
  # default "<TICKER> US Equity" -> <TICKER> rule: the 7 non-US Whiteboard
  # listings plus the malformed PRY.IM. Never inferred — src/price_history.py's
  # resolve_vendor_symbol raises if a bbg_ticker matches neither this map nor
  # the default rule.
  symbol_overrides:
    "EDEN FP Equity": "EDEN.PA"
    "SN/ LN Equity": "SN.L"
    "ASM NA Equity": "ASM.AS"
    "JBH AU Equity": "JBH.AX"
    "BRG AU Equity": "BRG.AX"
    "HPS/A CN Equity": "HPS-A.TO"
    "PRY.IM": "PRY.MI"
  # Backward-roll cap for the anchor price (calendar days) and forward-lookback
  # cap for the horizon price (calendar days) — see PHASE4B_SCOPE.md section 4.
  # Beyond these, a row/leg is unmeasurable and flagged, never silently dropped.
  anchor_roll_cap_days: 4
  horizon_lookback_days: 5
  # Anchor reconciliation: |vendor close on the anchor date - stored wba_price|
  # / stored wba_price, FRACTIONAL (prices range 2.23-1404.43 across the 105-row
  # base, so an absolute tolerance is meaningless). Unlike the tolerance below,
  # this is NOT purely arithmetic — vendor split-adjustment handling genuinely
  # differs from Bloomberg's. PROVISIONAL: seeded pending the first real pull's
  # measured max diff. A different value is a PM decision after seeing that
  # number, not a build-time adjustment.
  anchor_reconciliation_rel_tolerance: 0.02
  # Event-window replication gate (src/whiteboard_horizons.py's
  # check_event_window_replication): correlation floor between vendor-computed
  # short P&L and the workbook's own stored performance, evaluated over the
  # rows where a fixed-horizon window can be pointed at the ACTUAL stored
  # WBA->WBR dates instead of a fixed 6/12mo clock. Hard-fails the write below
  # this floor — mirrors historical.sign_convention_min_abs_corr.
  event_window_min_corr: 0.95
  # Minimum evaluated population required before the correlation above is even
  # trusted, per leg (absolute/relative), independent of the n>=2 NaN guard.
  # Correlation on a handful of survivors is not evidence a vendor pull mostly
  # succeeded — HARD-FAILS if n_evaluated < max(min_evaluated_abs,
  # min_evaluated_frac * n_attempted). Fraction generalizes as the sheet grows;
  # the absolute floor stops a small future file from clearing 80% on a
  # handful of rows and calling it a correlation.
  event_window_min_evaluated_frac: 0.80
  event_window_min_evaluated_abs: 30
  # Per-row absolute agreement tolerance for the same check, ABSOLUTE,
  # performance decimals (0.01 = 1pp) — arithmetic basis identical to
  # historical.benchmark_consistency_tolerance: every stored performance value
  # is rounded to a whole percentage point, bounding the expected gap at
  # ~0.005 plus price-rounding slack. Must NOT be widened to silence a real
  # violation — flags individual rows only, never gates on its own.
  event_window_abs_tolerance: 0.01
