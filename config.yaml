screens:
  short_screen:
    display_name: "OWS Short Screen"
    type: quant_composite

    universe:
      name: "OWS Short Screen"
      as_of: "2026-03"

    factor_weights:
      # Valuation (sum: 1.0)
      abs_ps_factor: 0.25
      rel_ps_factor: 0.25
      abs_fcf_factor: 0.25
      rel_fcf_factor: 0.25

      # Growth (sum: 1.0)
      decel_factor: 0.5
      accel_factor: 0.5

      # Profitability (sum: 1.0)
      gm_factor: 0.5
      ebit_factor: 0.5

      # Balance Sheet (sum: 1.0)
      debt_ebitda_factor: 0.2
      debt_sales_factor: 0.2
      debt_ev_factor: 0.2
      refi_risk_factor: 0.2
      liquidity_risk_factor: 0.2

      # Cash Flow (sum: 1.0, each weight: 1/7)
      fcf_conv_factor: 0.142857
      accrual_factor: 0.142857
      dso_factor: 0.142857
      dio_factor: 0.142857
      dpo_factor: 0.142857
      def_rev_factor: 0.142857
      dilution_factor: 0.142857

      # Non-GAAP (sum: 1.0)
      ebit_adj_factor: 0.5
      eps_adj_factor: 0.5

      # Sentiment (sum: 1.0)
      short_int_factor: 0.5
      ratings_factor: 0.5

    scoring:
      mscore_manipulation_threshold: -2.22
      nan_default_standard: 0.5
      nan_default_balance_sheet: 0.0
      nan_default_zero_factors:
        - debt_ebitda_factor
        - debt_sales_factor
        - liquidity_risk_factor
        - dso_factor
        - dio_factor
        - dpo_factor
        - def_rev_factor

  cyclicals:
    display_name: "Cyclicals"
    type: curated

    universe:
      name: "Cyclicals"
      as_of: "2026-08"

  competition:
    display_name: "Competition"
    type: curated

    universe:
      name: "Competition"
      as_of: "2026-08"

  structural:
    display_name: "Structural"
    type: curated

    universe:
      name: "Structural"
      as_of: "2026-08"

  management_comp:
    display_name: "Management Comp"
    type: curated

    universe:
      name: "Management Comp"
      as_of: "2026-08"

  rising_short_interest:
    display_name: "Rising Short Interest"
    type: quant_composite

    universe:
      name: "Rising Short Interest"
      as_of: "2026-08"
    # No factor_weights, no scoring block — this screen has no factor
    # model yet. That absence is the signal score.py and app.py use to
    # tell it apart from short_screen.

# Thresholds for src/refresh.py's pre-write validation gate (Phase 3d
# Part 2a). Proposed starting values — tune as real refresh cycles reveal
# normal turnover/noise levels.
refresh:
  # Null rate spike check: flag a column whose null rate rose by more than
  # this many percentage points versus the stored table. Ordinary week-to-
  # week noise in individual fields is a few points at most; a real break
  # (a dropped/renamed source column) tends to jump a column from near-0%
  # to near-100% null.
  null_rate_max_increase_pct: 0.15

# Thresholds for src/historical_ingest.py (Phase 4a). Not a screen — see
# that module's docstring.
historical:
  # Sign-convention gate: reject the import unless corr(price move,
  # Absolute Performance) <= -this value on both sheets. Measured on the
  # supplied file: -0.99998 (Active) / -0.99997 (Whiteboard) — 0.95 is a
  # wide margin below either, so this only trips on a genuine convention
  # flip (which would land near +1.0), never on ordinary noise.
  sign_convention_min_abs_corr: 0.95
  # Benchmark-consistency check: flag a row where recomputing relative
  # performance from its own price/benchmark levels differs from the
  # stored value by more than this (absolute, e.g. 0.01 = 1 percentage
  # point). Every performance value in the source file is rounded to a
  # whole percentage point, which bounds the expected gap at 0.005 plus a
  # little slack from 2dp-rounded price levels — measured max observed:
  # 0.00526 (Active, n=438), 0.00498 (Whiteboard, n=102). 0.01 is ~2x that
  # bound. Because the bound is arithmetic (rounding), not measurement
  # noise, it cannot grow on a future file — if this check ever fires,
  # something is genuinely wrong (wrong instrument, swapped column,
  # misaligned row) and the tolerance must NOT be widened to silence it.
  benchmark_consistency_tolerance: 0.01
